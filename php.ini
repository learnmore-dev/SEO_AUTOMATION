[PHP]
;; Custom php.ini for SEO System
extension_dir = "C:\Users\altaf\AppData\Local\Microsoft\WinGet\Packages\PHP.PHP.8.3_Microsoft.Winget.Source_8wekyb3d8bbwe\ext"

;; Extensions
extension=curl
extension=mbstring
extension=openssl
extension=pdo_sqlite
extension=sqlite3
extension=pdo_mysql
extension=mysqli
extension=fileinfo

;; Resource limits
max_execution_time = 300
memory_limit = 512M
post_max_size = 64M
upload_max_filesize = 64M

;; Timezone
date.timezone = "Asia/Kolkata"

;; Error display
display_errors = On
display_startup_errors = On
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
