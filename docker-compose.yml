services:
  app:
    build:
      context: .
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env
    environment:
      DB_TYPE: sqlite
      DB_SQLITE_PATH: /var/www/html/data/database.sqlite
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - app_data:/var/www/html/data
      - app_uploads:/var/www/html/uploads
      - app_logs:/var/www/html/logs
      - app_config:/var/www/html/config.local.php
    restart: unless-stopped

volumes:
  app_data:
  app_uploads:
  app_logs:
  app_config:
